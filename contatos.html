<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Máquinas - Contato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-4">
        <header class="bg-primary text-white text-center p-4 rounded shadow">
            <h1 class="display-4 font-weight-bold">ENTRE EM CONTATO</h1>
        </header>

        <nav class="nav nav-pills justify-content-center gap-3 my-4">
            <a class="nav-link bg-dark text-white" href="index.html">Início</a>
            <a class="nav-link active" href="contatos.html">Contato</a>
            <a class="nav-link bg-dark text-white" href="comentarios.html">Comentários</a>
        </nav>

        <section class="card p-4 shadow-sm mb-5">
            <h3 class="text-primary">Mande uma mensagem!</h3>
            <form action="#">
                <div class="mb-3">
                    <label for="nome" class="form-label fw-bold">Nome:</label>
                    <input type="text" class="form-control" id="nome" placeholder = "Digite seu nome aqui" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">E-mail:</label>
                    <input type="email" class="form-control" id="email" placeholder=" exemplo@gmail.com" required>
                </div>
                <div class="mb-3">
                    <label for="mensagem" class="form-label fw-bold">Mensagem:</label>
                    <textarea class="form-control" id="mensagem" rows="5" placeholder="Escreva sua mensagem aqui"></textarea>
                </div>
                <button type="submit" class="btn btn-success w-100">Enviar Contato</button>
            </form>
        </section>

        <footer class="bg-dark text-white text-center p-3 rounded">
            <p class="m-0">&copy; 2026 - Mundo dos Carros Esportivos (31) 9 9876-9999</p>
        </footer>
    </div>
</body>
</html>
